# Kargo writes `version` when golden-infra is promoted to the release stage. Do not edit it by hand.
#
# Renovate reads this file to decide which golden-infra tag consumer repos pin.
# `sourceUrl` and `dir` let it pull release notes into the PR body.
repo: github.com/Fomiller/flake-hub
dir: golden-infra
sourceUrl: https://github.com/Fomiller/flake-hub
version: golden-infra-0.7.0
